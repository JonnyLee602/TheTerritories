<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="hidden">
  <div class="panel">
    <div class="panel-header">
      <span class="circle-btn" aria-hidden="true"></span>
      <div class="header-text"><div class="title" id="title"></div><div class="subtitle" id="subtitle"></div></div>
      <button class="circle-btn" id="close">✕</button>
    </div>
    <div class="divider"><span>✦</span></div>
    <div class="note-text" id="text"></div>
    <div class="note-meta" id="meta"><span id="good-for"></span><strong id="timer"></strong></div>
    <div class="note-group" id="group"></div>
    <div class="actions">
      <button class="wood-btn muted" id="put-away"></button>
      <button class="wood-btn" id="act"></button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
