<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="hidden">
  <div class="panel" id="panel">
    <div class="panel-header">
      <button class="circle-btn" id="back" title="Back">‹</button>
      <div class="head-text"><div class="title" id="title"></div><div class="subtitle" id="subtitle"></div></div>
      <button class="circle-btn" id="close" title="Close">✕</button>
    </div>
    <div class="divider"><span>✦</span></div>
    <div class="tabs hidden" id="tabs"></div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="modal-wrap" class="hidden"><div class="modal" id="modal"></div></div>
<script src="script.js"></script>
</body>
</html>
