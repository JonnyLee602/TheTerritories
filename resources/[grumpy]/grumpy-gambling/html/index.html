<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>grumpy-gambling</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="hidden">
    <div class="panel" id="panel">
      <div class="panel-header">
        <button class="circle-btn" id="btn-back" title="">&#10094;</button>
        <div>
          <div class="title" id="title"></div>
          <div class="subtitle" id="subtitle"></div>
        </div>
        <button class="circle-btn" id="btn-close" title="">&#10005;</button>
      </div>
      <div class="divider">&#10022;</div>
      <div id="tabs" class="tabs hidden"></div>
      <div id="content" class="content"></div>
    </div>

    <div id="modal-wrap" class="modal-wrap hidden">
      <div class="modal">
        <div class="title modal-title" id="modal-title"></div>
        <div class="ink-divider"></div>
        <div id="modal-body"></div>
        <div class="modal-actions" id="modal-actions"></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
