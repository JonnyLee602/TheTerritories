$engine: 3
$onesync: on
name: The Territories
version: 2026.11.06
author: Grumpy
description: |
  The Territories RedM server: RSG framework (pinned, with Territories customizations),
  grumpy-* scripts and the Territories NPC stores. Based on Rexshack's txAdminRecipe.

# GENERATED by tools/build-recipe.py - don't edit by hand, run the script.
# Stock RSG resources: Rexshack-RedM at the commit in upstream.lock.
# Customized RSG resources (11) and grumpy scripts (12): https://github.com/JonnyLee602/TheTerritories (main).
tasks:
  # ================================================================ Base files

  - action: download_github  # server.cfg, logo, SQL
    src: https://github.com/JonnyLee602/TheTerritories
    ref: main
    subpath: recipe
    dest: ./tmp/territories
    timeoutSeconds: 600

  - action: move_path
    src: ./tmp/territories/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/territories/territories-logo.png
    dest: ./myLogo.png

  # ================================================================ Database
  # RSG's tables (RSG's recipe SQL, matching the pinned framework), then the Territories NPC stores
  - action: connect_database
  - action: query_database
    file: ./tmp/territories/rsg/rsgcore.sql
  - action: query_database
    file: ./tmp/territories/territories_stores.sql

  # grumpy tables (copies of each script's install.sql, all CREATE TABLE IF NOT EXISTS)
  - action: query_database
    file: ./tmp/territories/grumpy/grumpy-bartender.sql
  - action: query_database
    file: ./tmp/territories/grumpy/grumpy-gambling.sql
  - action: query_database
    file: ./tmp/territories/grumpy/grumpy-groups.sql
  - action: query_database
    file: ./tmp/territories/grumpy/grumpy-hotel.sql
  - action: query_database
    file: ./tmp/territories/grumpy/grumpy-pob.sql
  - action: query_database
    file: ./tmp/territories/grumpy/grumpy-reputation.sql
  - action: query_database
    file: ./tmp/territories/grumpy/grumpy-robbery.sql
  - action: query_database
    file: ./tmp/territories/grumpy/grumpy-trader.sql

  # ================================================================ Standalone
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    subpath: resources
    dest: ./resources/[cfx-default]
    timeoutSeconds: 600

  - action: download_file
    path: ./tmp/files/oxmysql.zip
    url: https://github.com/CommunityOx/oxmysql/releases/latest/download/oxmysql.zip
  - action: unzip
    src: ./tmp/files/oxmysql.zip
    dest: ./resources/[standalone]

  - action: download_github
    src: https://github.com/Rexshack-RedM/ox_lib
    ref: main
    dest: ./resources/[standalone]/ox_lib

  - action: download_github
    src: https://github.com/Rexshack-RedM/PolyZone
    ref: main
    dest: ./resources/[standalone]/PolyZone

  - action: download_github
    src: https://github.com/Xogy/xsound
    ref: master
    dest: ./resources/[standalone]/xsound

  - action: download_github
    src: https://github.com/Rexshack-RedM/interact-sound
